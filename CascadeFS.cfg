\* CascadeFS.cfg — TLC configuration for CascadeFS spec.
\*
\* SAFETY-ONLY configuration (INVARIANTs, no PROPERTY) + SYMMETRY.
\*
\* WHY no PROPERTY here: TLC's symmetry reduction is UNSOUND for
\* liveness checking. Fair-permitting cycles in the quotient graph
\* need not correspond to fair cycles in the full graph — with
\* PROPERTY + SYMMETRY, TLC produced a FALSE ReadCompletes violation
\* (a lasso where the starved read's CompleteRead was continuously
\* enabled; the same model checks clean without symmetry). Safety
\* (state predicates) under symmetry IS sound. Liveness is checked
\* by verify.sh in a separate NO-symmetry run with the same
\* constants plus the PROPERTY block.

SPECIFICATION Spec

\* Safety invariants (state predicates only).
INVARIANT TypeOK
INVARIANT DepthInv
INVARIANT FilesAboveMin
INVARIANT Raise01Commit
INVARIANT Raise12Commit
INVARIANT Raise23Commit
INVARIANT WriteIsLinearizable
INVARIANT ReadNoLost

CONSTANTS
    \* 4 hashes: the granular writer's descend branch (WDirAbsentStep,
    \* 4.2.2.1) requires a state with max > min AND an unwritten hash —
    \* with 3 hashes every such state already has all hashes stored
    \* (TLC coverage flagged it 0:0). 4 hashes keep every action live.
    Hashes = {h1, h2, h3, h4}
    Levels = {0, 1, 2, 3, 4}
    DirLimit = 2
    NumSub = 2

\* Symmetry reduction over hashes. Sound FOR SAFETY ONLY — the
\* canonical argument and the liveness caveat are in TLA.md 2.5.
\* Shrinks the space ~|Hashes|!.
SYMMETRY HashSymmetry

CHECK_DEADLOCK FALSE
